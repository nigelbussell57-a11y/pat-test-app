<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Test Rig — Offline Edition</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16233A">
<script src="./html5-qrcode.min.js"></script>
<script src="./xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16233A;
  --ink-soft:#4A5568;
  --paper:#ECEFEA;
  --panel:#FFFFFF;
  --line:#CDD3C8;
  --yellow:#F5B700;
  --yellow-deep:#C99000;
  --green:#1F8A5F;
  --green-bg:#E4F3EC;
  --red:#C4392B;
  --red-bg:#FBE7E4;
  --amber:#C97A1B;
  --amber-bg:#FBEEDD;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:inherit;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code','Segoe UI Mono',Consolas,'Roboto Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:15px;}

/* ---------- Header / Nav ---------- */
#app-header{
  background:var(--ink);
  color:#fff;
  padding:14px 16px 0;
  position:sticky; top:0; z-index:50;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.brand-tag{
  width:34px;height:34px;background:var(--yellow);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;color:var(--ink);font-size:15px;
  position:relative;flex:none;
}
.brand-tag::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.35;}
.brand h1{font-size:17px;color:#fff;}
.brand span{font-size:11.5px;color:#B9C2D4;display:block;font-weight:500;}
.job-chip{
  margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);padding:5px 9px;border-radius:20px;color:#DCE3F0;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
nav#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
nav#tabs::-webkit-scrollbar{display:none;}
nav#tabs button{
  flex:none;background:none;border:none;color:#AEB8CC;padding:10px 12px 12px;
  font-size:13px;font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap;
}
nav#tabs button.active{color:#fff;border-bottom-color:var(--yellow);}

main{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.panel h2{font-size:15px;}
.hint{color:var(--ink-soft);font-size:12.5px;margin:2px 0 14px;line-height:1.5;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--yellow-deep);outline-offset:1px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{
  border:none;border-radius:9px;padding:12px 18px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{background:var(--yellow);color:var(--ink);width:100%;}
.btn-primary:active{background:var(--yellow-deep);}
.btn-primary:disabled{opacity:.4;}
.btn-secondary{background:#fff;border:1.5px solid var(--ink);color:var(--ink);}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-danger{background:var(--red);color:#fff;}
.btn-row{display:flex;gap:10px;margin-top:6px;}
.btn-row .btn{flex:1;}

/* ---------- Steps ---------- */
#steps{display:flex;gap:6px;margin-bottom:16px;}
.step-dot{
  flex:1;text-align:center;padding:8px 4px;border-radius:7px;font-size:10.5px;font-weight:700;
  background:#fff;border:1.5px dashed var(--line);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;
}
.step-dot.done{background:var(--green-bg);border-style:solid;border-color:var(--green);color:var(--green);}
.step-dot.now{background:var(--ink);border-style:solid;border-color:var(--ink);color:#fff;}
.step-dot.clickable-step{cursor:pointer;}
.step-dot.clickable-step:active{transform:scale(0.97);}

/* ---------- Test label motif ---------- */
.tag-card{
  background:var(--yellow);border-radius:12px;padding:18px 16px;position:relative;margin-bottom:14px;
  box-shadow:0 3px 0 var(--yellow-deep);
}
.tag-card::before{
  content:'';position:absolute;top:14px;left:-7px;width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:2px solid var(--yellow-deep);
}
.tag-card .eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6B4E00;margin-bottom:3px;}
.tag-card .big{font-family:'IBM Plex Mono';font-size:22px;font-weight:600;color:var(--ink);word-break:break-all;}
.tag-card .sub{font-size:12.5px;color:#6B4E00;margin-top:4px;}

/* ---------- Scanner ---------- */
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px;}
.scan-frame{position:relative;}
.manual-entry{display:flex;gap:8px;margin-top:8px;}
.manual-entry input{flex:1;}

/* ---------- Badges ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-pass{background:var(--green-bg);color:var(--green);}
.badge-fail{background:var(--red-bg);color:var(--red);}
.badge-warn{background:var(--amber-bg);color:var(--amber);}
.badge-muted{background:#EDEFEA;color:var(--ink-soft);}

.result-hero{text-align:center;padding:26px 16px;border-radius:12px;margin-bottom:14px;}
.result-hero.pass{background:var(--green-bg);}
.result-hero.fail{background:var(--red-bg);}
.result-hero .status{font-family:'Space Grotesk';font-size:30px;font-weight:700;}
.result-hero.pass .status{color:var(--green);}
.result-hero.fail .status{color:var(--red);}
.fail-list{list-style:none;padding:0;margin:10px 0 0;text-align:left;}
.fail-list li{background:#fff;border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:6px;color:var(--red);border:1px solid #F0C6C0;}
.check-list{list-style:none;padding:0;margin:0;}
.check-list li{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px;border-bottom:1px solid #F0F1EC;}
.check-list li:last-child{border-bottom:none;}
.check-ok{color:var(--green);font-weight:700;}
.check-pending{color:var(--ink-soft);}

/* ---------- Tables ---------- */
.toolbar{display:flex;gap:8px;margin-bottom:12px;}
.toolbar input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:8px 8px;border-bottom:2px solid var(--line);}
td{padding:9px 8px;border-bottom:1px solid #EEF0EA;vertical-align:top;}
tr.clickable{cursor:pointer;}
tr.clickable:active{background:#F5F6F1;}
.asset-no{font-family:'IBM Plex Mono';font-weight:600;}
.empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);}
.empty-state .big-emoji{font-size:34px;margin-bottom:8px;}

.detail-card{background:#F7F8F4;border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px;font-size:13px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:8px;}
.detail-grid div b{display:block;font-size:10px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.small-note{font-size:11.5px;color:var(--ink-soft);}
.pill-tabs{display:flex;gap:6px;margin-bottom:14px;}
.pill-tabs button{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink-soft);}
.pill-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #EEF0EA;font-size:13.5px;}
.list-row:last-child{border-bottom:none;}
.list-row .meta{color:var(--ink-soft);font-size:12px;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.assumptions{background:#fff;border:1.5px dashed var(--line);border-radius:9px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
.assumptions b{color:var(--ink);}
</style>
</head>
<body>

<div id="app-header">
  <div class="brand">
    <div class="brand-tag">PAT</div>
    <div>
      <h1>Asset Test Rig <span style="opacity:.6;font-weight:500;">· Offline</span></h1>
      <span id="job-sub">No job started</span>
    </div>
    <div class="job-chip" id="job-chip" style="display:none;"></div>
  </div>
  <nav id="tabs"></nav>
</div>

<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   STORAGE LAYER — local to this device only, via IndexedDB. Nothing here
   ever touches a network. All data lives in this one browser, on this one
   device, until you export/import an Excel backup yourself.
   ========================================================================= */
const TABLES = ['assetRegister','testEquipment','engineers','testHistory','jobLog','settings'];
let DB = { assetRegister: [], testEquipment: [], engineers: [], testHistory: [], jobLog: [],
  settings: { earthBondMax:0.1, insulationMin:1, leakageMaxClassI:3.5, leakageMaxClassII:0.5, microwaveLeakageMax:5, retestMonths:12, nextTestSeq:1 } };

const IDB_NAME = 'patTestRigOffline';
const IDB_VERSION = 1;
const IDB_STORE = 'tables';

function openIdb(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbGet(key){
  return openIdb().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  }));
}
function idbSet(key, value){
  return openIdb().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).put(value, key);
    req.onsuccess = ()=>resolve();
    req.onerror = ()=>reject(req.error);
  }));
}
function idbClearAll(){
  return openIdb().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).clear();
    req.onsuccess = ()=>resolve();
    req.onerror = ()=>reject(req.error);
  }));
}

let storageStatus = 'ok'; // ok | error — IndexedDB can fail in private/incognito modes on some browsers

async function loadAll(){
  try{
    for(const t of TABLES){
      const val = await idbGet(t);
      if(val !== undefined && val !== null){
        if(t==='settings') DB.settings = Object.assign({}, DB.settings, val);
        else DB[t] = val;
      }
    }
    storageStatus = 'ok';
  }catch(e){
    storageStatus = 'error';
    console.error('IndexedDB load error', e);
    toast('Could not open local storage — try a normal browser tab, not private/incognito mode');
  }
}
async function save(table){
  try{
    await idbSet(table, DB[table]);
    storageStatus = 'ok';
  }catch(e){
    storageStatus = 'error';
    console.error('IndexedDB save error', table, e);
    toast('Save failed — local storage may be full or unavailable');
  }
}
async function saveMany(tables){
  for(const t of tables){ await save(t); }
}
/* =========================================================================
   STATE
   ========================================================================= */
let currentJob = null;      // {jobId, site, equipmentId, equipmentLabel, serial, calDate, engineerId, engineerName, date}
let wizardStep = 'job';     // job -> scan -> readings -> check -> result
let currentAsset = null;    // {assetNo, description, location, site, class, isNew}
let currentReadings = null;
let currentResult = null;
let qrScanner = null;
let activeTab = 'newtest';

const TABS = [
  {id:'newtest', label:'New Test'},
  {id:'register', label:'Asset Register'},
  {id:'history', label:'Test History'},
  {id:'people', label:'Equipment & Engineers'},
  {id:'io', label:'Import / Export'},
  {id:'settings', label:'Settings'},
];

/* =========================================================================
   UTIL
   ========================================================================= */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2600);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function fmtDate(d){
  if(!d) return '—';
  try{ const dt = new Date(d); if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }catch(e){ return d; }
}
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genId(prefix){
  const n = DB.settings.nextTestSeq || 1;
  DB.settings.nextTestSeq = n+1;
  return prefix + '-' + String(n).padStart(5,'0');
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const ms = new Date(dateStr).getTime() - new Date(todayISO()).getTime();
  return Math.round(ms/86400000);
}

/* =========================================================================
   RENDER — HEADER / NAV
   ========================================================================= */
function renderHeader(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ activeTab=b.dataset.tab; if(activeTab==='newtest' && !currentJob) wizardStep='job'; renderAll(); });

  const sub = document.getElementById('job-sub');
  const chip = document.getElementById('job-chip');
  if(currentJob){
    sub.textContent = 'Job in progress';
    chip.style.display = 'block';
    chip.style.cursor = 'pointer';
    chip.title = 'Back to Job details';
    chip.textContent = `${currentJob.site} · ${currentJob.engineerName}`;
    chip.onclick = ()=>{ activeTab='newtest'; wizardStep='job'; renderAll(); };
  }else{
    sub.textContent = 'No job started';
    chip.style.display = 'none';
    chip.onclick = null;
  }
}

function renderAll(){
  renderHeader();
  const view = document.getElementById('view');
  stopScanner();
  if(activeTab==='newtest') view.innerHTML = renderNewTest();
  else if(activeTab==='register') view.innerHTML = renderRegister();
  else if(activeTab==='history') view.innerHTML = renderHistory();
  else if(activeTab==='people') view.innerHTML = renderPeople();
  else if(activeTab==='io') view.innerHTML = renderIO();
  else if(activeTab==='settings') view.innerHTML = renderSettings();
  bindHandlers();
}

/* =========================================================================
   NEW TEST WIZARD
   ========================================================================= */
function stepIndicator(){
  const steps = [['job','Job'],['scan','Scan'],['readings','Readings'],['check','Checks'],['result','Result']];
  const order=['job','scan','readings','check','result'];
  const cur = order.indexOf(wizardStep);
  return `<div id="steps">${steps.map(([id,label])=>{
    const th = order.indexOf(id);
    let cls = th<cur ? 'done' : (th===cur ? 'now' : '');
    // Job is always reachable (to start over / change job); other steps
    // are only clickable once you've actually reached them.
    const reachable = id==='job' || th<=cur;
    return `<div class="step-dot ${cls}${reachable?' clickable-step':''}" ${reachable?`data-goto="${id}"`:''}>${label}</div>`;
  }).join('')}</div>`;
}

function gotoStep(id){
  if(id==='job'){ wizardStep='job'; renderAll(); return; }
  if((id==='readings'||id==='check'||id==='result') && !currentAsset){ toast('Scan or enter an asset first'); return; }
  if(id==='check' && !currentReadings){ toast('Enter readings first'); return; }
  if(id==='result' && !currentResult){ toast('Run the checks first'); return; }
  wizardStep = id;
  renderAll();
}

function renderNewTest(){
  if(wizardStep==='job') return stepIndicator() + renderJobStep();
  if(wizardStep==='scan') return stepIndicator() + renderScanStep();
  if(wizardStep==='readings') return stepIndicator() + renderReadingsStep();
  if(wizardStep==='check') return stepIndicator() + renderCheckStep();
  if(wizardStep==='result') return stepIndicator() + renderResultStep();
  return '';
}

function renderJobStep(){
  const activeEquip = DB.testEquipment.filter(e=>e.active!=='No');
  const activeEng = DB.engineers.filter(e=>e.active!=='No');
  const sites = [...new Set(DB.assetRegister.map(a=>a.site).filter(Boolean))];
  return `
  <div class="panel">
    <h2>Job details login</h2>
    <p class="hint">Set the site, the test instrument being used, and the engineer on the tools. This locks in the instrument's serial &amp; calibration date against every test in this job.</p>
    <div class="field">
      <label>Site</label>
      <input id="f-site" list="site-list" placeholder="e.g. Yeovil Distribution Centre" value="${esc(currentJob?.site||'')}">
      <datalist id="site-list">${sites.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    </div>
    <div class="field">
      <label>Test equipment</label>
      ${activeEquip.length? `<select id="f-equip">
        <option value="">Select instrument…</option>
        ${activeEquip.map(e=>`<option value="${esc(e.id)}" ${currentJob?.equipmentId===e.id?'selected':''}>${esc(e.makeModel)} — ${esc(e.serial)}${calWarning(e.calDate)}</option>`).join('')}
      </select>` : `<div class="hint" style="margin:0;color:var(--red)">No active test instruments registered yet. Add one under "Equipment &amp; Engineers".</div>`}
    </div>
    <div class="field">
      <label>Engineer</label>
      ${activeEng.length? `<select id="f-eng">
        <option value="">Select engineer…</option>
        ${activeEng.map(e=>`<option value="${esc(e.id)}" ${currentJob?.engineerId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
      </select>` : `<div class="hint" style="margin:0;color:var(--red)">No active engineers registered yet. Add one under "Equipment &amp; Engineers".</div>`}
    </div>
    <button class="btn btn-primary" id="btn-start-job">Log job &amp; continue to scan</button>
  </div>`;
}
function calWarning(calDate){
  const d = daysUntil(calDate);
  if(d===null) return '';
  if(d<0) return '  ⚠ CAL OVERDUE';
  if(d<30) return '  ⚠ cal due soon';
  return '';
}

function renderScanStep(){
  return `
  <div class="panel">
    <div class="section-title"><h2>Scan asset</h2><button class="btn btn-ghost" id="btn-back-job" style="padding:6px 10px;font-size:12px;">Change job</button></div>
    <p class="hint">Point the camera at the QR code or barcode on the asset's test label.</p>
    <div class="scan-frame">
      <div id="reader"></div>
    </div>
    <button class="btn btn-primary" id="btn-cam-toggle">Start camera</button>
    <div class="manual-entry">
      <input id="f-manual-asset" placeholder="…or type Asset No. manually" class="mono">
      <button class="btn btn-secondary" id="btn-manual-go">Go</button>
    </div>
  </div>`;
}

function renderReadingsStep(){
  const a = currentAsset;
  const r = currentReadings || {visual:'', earthBond:'', insulation:'', load:'', leakage:'', polarity:'', microwaveLeakage:'', notes:''};
  const isMicrowave = a.applianceType==='Microwave';
  return `
  <div class="tag-card">
    <div class="eyebrow">Asset under test</div>
    <div class="big">${esc(a.assetNo)}</div>
    <div class="sub">${esc(a.description||'Description not yet recorded')} ${a.location? ' · '+esc(a.location):''}</div>
  </div>
  <div class="panel">
    <h2>Asset details</h2>
    <div class="row2">
      <div class="field"><label>Description</label><input id="f-desc" value="${esc(a.description)}" placeholder="e.g. Desk fan"></div>
      <div class="field"><label>Location</label><input id="f-loc" value="${esc(a.location)}" placeholder="e.g. Office 2, Desk 4"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Appliance class</label>
        <select id="f-class">
          <option value="I" ${a.class==='I'?'selected':''}>Class I (earthed)</option>
          <option value="II" ${a.class==='II'?'selected':''}>Class II (double insulated)</option>
        </select>
      </div>
      <div class="field">
        <label>Appliance type</label>
        <select id="f-appliance-type">
          <option value="General" ${!isMicrowave?'selected':''}>General</option>
          <option value="Microwave" ${isMicrowave?'selected':''}>Microwave oven</option>
        </select>
      </div>
    </div>
    ${isMicrowave? `<div class="hint" style="margin:0;">Microwave ovens get an extra RF leakage check below, alongside the usual electrical tests.</div>`:''}
  </div>
  <div class="panel">
    <h2>Visual &amp; polarity</h2>
    <div class="row2">

function frontEndCheck(){
  const r = currentReadings;
  const items = [
    {label:'Visual inspection recorded', ok: r.visual==='Pass'||r.visual==='Fail'},
    {label:'Polarity recorded', ok: r.polarity==='Pass'||r.polarity==='Fail'},
  ];
  if(currentAsset.class!=='II'){
    items.push({label:'Earth bond reading entered', ok: r.earthBond!==''&&!isNaN(r.earthBond)});
  }
  items.push(
    {label:'Insulation reading entered', ok: r.insulation!==''&&!isNaN(r.insulation)},
    {label:'Load reading entered', ok: r.load!==''&&!isNaN(r.load)},
    {label:'Leakage reading entered', ok: r.leakage!==''&&!isNaN(r.leakage)},
    {label:'No negative readings', ok: [r.earthBond,r.insulation,r.load,r.leakage].every(v=>v===''||parseFloat(v)>=0)},
  );
  if(currentAsset.applianceType==='Microwave'){
    items.push({label:'Microwave leakage reading entered', ok: r.microwaveLeakage!==''&&!isNaN(r.microwaveLeakage)&&parseFloat(r.microwaveLeakage)>=0});
  }
  return {items, allOk: items.every(i=>i.ok)};
}
function serverCheck(){
  const items = [];
  const eq = DB.testEquipment.find(e=>e.id===currentJob.equipmentId);
  const calDays = eq? daysUntil(eq.calDate): null;
  items.push({label: eq? `Instrument calibration current (due ${fmtDate(eq.calDate)})` : 'Instrument on record', ok: calDays!==null && calDays>=0});
  const eng = DB.engineers.find(e=>e.id===currentJob.engineerId);
  items.push({label: eng? `Engineer "${eng.name}" active on register` : 'Engineer on record', ok: !!eng && eng.active!=='No'});
  const dup = DB.assetRegister.find(a=>String(a.assetNo)===String(currentAsset.assetNo) && String(a.assetNo)!==String(currentAsset._originalAssetNo));
  items.push({label: currentAsset.isNew ? 'Asset No. not already in register' : 'Existing asset record located', ok: currentAsset.isNew? !dup : true});
  return {items};
}

/* =========================================================================
   SCANNER
   ========================================================================= */
function stopScanner(){
  if(qrScanner){
    try{ qrScanner.stop().then(()=>qrScanner.clear()).catch(()=>{}); }catch(e){}
    qrScanner = null;
  }
}
function startScanner(){
  const readerEl = document.getElementById('reader');
  if(!readerEl) return;
  qrScanner = new Html5Qrcode('reader');
  const config = { fps: 10, qrbox: { width: 240, height: 240 } };
  qrScanner.start({ facingMode: 'environment' }, config,
    (decodedText)=>{ onAssetScanned(decodedText); },
    ()=>{ /* per-frame miss, ignore */ }
  ).catch(err=>{
    toast('Camera unavailable — enter the Asset No. manually below');
    console.error(err);
  });
}
function onAssetScanned(text){
  stopScanner();
  toast('Scanned: ' + text);
  loadAssetIntoWizard(text.trim());
}
function loadAssetIntoWizard(assetNo){
  const existing = DB.assetRegister.find(a=>String(a.assetNo)===String(assetNo));
  if(existing){
    currentAsset = { assetNo, description: existing.description||'', location: existing.location||'',
      site: currentJob.site, class: existing.class||'I', applianceType: existing.applianceType||'General',
      isNew:false, _originalAssetNo: assetNo };
  }else{
    currentAsset = { assetNo, description:'', location:'', site: currentJob.site, class:'I', applianceType:'General', isNew:true, _originalAssetNo: assetNo };
  }
  currentReadings = {visual:'', earthBond:'', insulation:'', load:'', leakage:'', polarity:'', microwaveLeakage:'', notes:''};
  wizardStep = 'readings';
  renderAll();
}

/* =========================================================================
   RESULT CALCULATION
   ========================================================================= */
function calculateResult(){
  const r = currentReadings, s = DB.settings, fails = [];
  if(r.visual!=='Pass') fails.push('Visual inspection: Fail');
  if(r.polarity!=='Pass') fails.push('Polarity: Fail');
  const eb = parseFloat(r.earthBond);
  if(currentAsset.class!=='II' && !isNaN(eb) && eb > s.earthBondMax) fails.push(`Earth bond ${eb}Ω exceeds limit of ${s.earthBondMax}Ω`);
  const ins = parseFloat(r.insulation);
  if(!isNaN(ins) && ins < s.insulationMin) fails.push(`Insulation ${ins}MΩ is below minimum of ${s.insulationMin}MΩ`);
  const leakLimit = currentAsset.class==='II' ? s.leakageMaxClassII : s.leakageMaxClassI;
  const leak = parseFloat(r.leakage);
  if(!isNaN(leak) && leak > leakLimit) fails.push(`Leakage ${leak}mA exceeds Class ${currentAsset.class} limit of ${leakLimit}mA`);
  const load = parseFloat(r.load);
  if(!isNaN(load) && load===0) fails.push('No load current detected (possible open circuit)');
  if(currentAsset.applianceType==='Microwave'){
    const mw = parseFloat(r.microwaveLeakage);
    if(!isNaN(mw) && mw > s.microwaveLeakageMax) fails.push(`Microwave leakage ${mw}mW/cm² exceeds limit of ${s.microwaveLeakageMax}mW/cm²`);
  }
  return { pass: fails.length===0, fails };
}

function sheetToRows(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return [];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}
function excelDateToISO(v){
  if(v===''||v===undefined||v===null) return '';
  if(typeof v==='number'){ const d = XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const d = new Date(v); return isNaN(d)? String(v) : d.toISOString().slice(0,10);
}
function importFile(mode){
  const inp = document.getElementById('io-file');
  if(!inp.files.length){ toast('Choose a file first'); return; }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const arRows = sheetToRows(wb,'Asset Register').map(r=>({
        assetNo:String(r['Asset No.']||''), description:r['Appliance Description']||'', location:r['Location']||'', site:r['Site']||'',
        testDate:excelDateToISO(r['Test Date']), retestDate:excelDateToISO(r['Re-Test Date']), visual:r['Visual (Pass/Fail)']||'',
        earthBond:r['Earth Bond (Ω)']||'', insulation:r['Insulation (MΩ)']||'', load:r['Load (A)']||'', leakage:r['Leakage (mA)']||'',
        polarity:r['Polarity (Pass/Fail)']||'', passFail:r['Pass/Fail']||'', tester:r['Tester']||'', testerSerial:r['Tester Serial No.']||'',
        calDate:excelDateToISO(r['Calibration Date']), engineer:r['Engineer']||'', notes:r['Notes']||'', status:r['Status']||'Active',
        class:'I', applianceType:r['Appliance Type']||'General', microwaveLeakage:r['Microwave Leakage (mW/cm²)']||''
      })).filter(r=>r.assetNo);
      const teRows = sheetToRows(wb,'Test Equipment').map(r=>({id:String(r['Equipment ID']||''), makeModel:r['Make / Model']||'', serial:r['Serial No.']||'', calDate:excelDateToISO(r['Calibration Date']), active:r['Active']||'Yes', notes:r['Notes']||''})).filter(r=>r.id);
      const enRows = sheetToRows(wb,'Engineers').map(r=>({id:String(r['Engineer ID']||''), name:r['Engineer Name']||'', active:r['Active']||'Yes', notes:r['Notes']||''})).filter(r=>r.id);
      const thRows = sheetToRows(wb,'Test History').map(r=>({
        testId:String(r['Test ID']||''), assetNo:String(r['Asset No.']||''), description:r['Appliance Description']||'', location:r['Location']||'', site:r['Site']||'',
        testDate:excelDateToISO(r['Test Date']), retestDate:excelDateToISO(r['Re-Test Date']), visual:r['Visual (Pass/Fail)']||'',
        earthBond:r['Earth Bond (Ω)']||'', insulation:r['Insulation (MΩ)']||'', load:r['Load (A)']||'', leakage:r['Leakage (mA)']||'',
        polarity:r['Polarity (Pass/Fail)']||'', passFail:r['Pass/Fail']||'', tester:r['Tester']||'', testerSerial:r['Tester Serial No.']||'',
        calDate:excelDateToISO(r['Calibration Date']), engineer:r['Engineer']||'', notes:r['Notes']||'',
        applianceType:r['Appliance Type']||'General', microwaveLeakage:r['Microwave Leakage (mW/cm²)']||''
      })).filter(r=>r.testId);

      if(mode==='replace'){
        DB.assetRegister = arRows; DB.testEquipment = teRows; DB.engineers = enRows; DB.testHistory = thRows;
      }else{
        mergeByKey(DB.assetRegister, arRows, 'assetNo');
        mergeByKey(DB.testEquipment, teRows, 'id');
        mergeByKey(DB.engineers, enRows, 'id');
        mergeByKey(DB.testHistory, thRows, 'testId');
      }
      await saveMany(['assetRegister','testEquipment','engineers','testHistory']);
      toast(`Imported ${arRows.length} assets, ${teRows.length} instruments, ${enRows.length} engineers, ${thRows.length} test records`);
      renderAll();
    }catch(err){
      console.error(err);
      toast('Could not read that file — check it matches the expected format');
    }
  };
  reader.readAsArrayBuffer(inp.files[0]);
}
function mergeByKey(target, incoming, key){
  incoming.forEach(row=>{
    const idx = target.findIndex(t=>t[key]===row[key]);
    if(idx>-1) target[idx] = Object.assign({}, target[idx], row);
    else target.push(row);
  });
}

/* =========================================================================
   SETTINGS
   ========================================================================= */

    ? '<span class="badge badge-pass">Storage OK</span>'
    : '<span class="badge badge-fail">Storage error</span>';
  return `
  <div class="panel">
    <div class="section-title"><h2>Offline storage</h2>${statusBadge}</div>
    <p class="hint">Everything you enter here — asset register, equipment, engineers, test history — is saved locally in this browser on this device only. There's no server and no internet connection required after the app first loads. Nothing is shared between devices automatically.</p>
    <p class="hint">Because it's local-only, <b>the Excel backup in Import / Export is your only copy outside this device.</b> Export it regularly, and if you ever move to a new phone or tablet, export here and import there.</p>
  </div>
  <div class="assumptions"><b>How results are scored.</b> These thresholds follow common UK PAT-testing guidance (IET Code of Practice) as sensible defaults — check them against your own procedures and adjust if needed.</div>
  <div class="panel">
    <h2>Pass / fail thresholds</h2>
    <div class="row2">
      <div class="field"><label>Max earth bond (Ω)</label><input type="number" step="0.01" id="s-earth" value="${esc(s.earthBondMax)}"></div>
      <div class="field"><label>Min insulation (MΩ)</label><input type="number" step="0.01" id="s-insul" value="${esc(s.insulationMin)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Max leakage, Class I (mA)</label><input type="number" step="0.01" id="s-leak1" value="${esc(s.leakageMaxClassI)}"></div>
      <div class="field"><label>Max leakage, Class II (mA)</label><input type="number" step="0.01" id="s-leak2" value="${esc(s.leakageMaxClassII)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Max microwave leakage (mW/cm²)</label><input type="number" step="0.01" id="s-mwleak" value="${esc(s.microwaveLeakageMax)}"></div>
      <div class="field"><label>Retest interval (months)</label><input type="number" id="s-retest" value="${esc(s.retestMonths)}"></div>
    </div>
    <button class="btn btn-primary" id="btn-save-settings">Save thresholds</button>
  </div>
  <div class="panel">
    <h2>About this app</h2>
    <p class="hint" style="margin-bottom:8px;">Offline Edition — runs entirely in the browser on your phone, tablet, or laptop, works on Android (Chrome) and iPad (Safari), and needs no internet connection once it's loaded. Install it to your home screen for the full app-like experience. Use the camera to read QR codes and most common 1D barcodes.</p>
  </div>
  <div class="panel">
    <h2>Danger zone</h2>
    <p class="hint">Wipes every record stored on this device. Export a backup first if you want to keep it.</p>
    <button class="btn btn-danger" id="btn-clear-all">Clear all data</button>
  </div>`;
}

/* =========================================================================
   EVENT BINDING
   ========================================================================= */
function bindHandlers(){
  // -- Step indicator quick-nav --
  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>gotoStep(el.dataset.goto));

  // -- New test wizard --
  const startJobBtn = document.getElementById('btn-start-job');
  if(startJobBtn) startJobBtn.onclick = async ()=>{
    const site = document.getElementById('f-site').value.trim();
    const equipId = document.getElementById('f-equip')?.value;
    const engId = document.getElementById('f-eng')?.value;
    if(!site){ toast('Enter a site'); return; }
    if(!equipId){ toast('Select a test instrument'); return; }
    if(!engId){ toast('Select an engineer'); return; }
    const eq = DB.testEquipment.find(e=>e.id===equipId);
    const eng = DB.engineers.find(e=>e.id===engId);
    currentJob = { jobId: genId('J'), site, equipmentId: equipId, equipmentLabel: eq.makeModel, serial: eq.serial, calDate: eq.calDate, engineerId: engId, engineerName: eng.name, date: todayISO() };
    DB.jobLog.push(currentJob);
    await save('jobLog'); await save('settings');
    wizardStep = 'scan';
    renderAll();
  };

  const camToggle = document.getElementById('btn-cam-toggle');
  if(camToggle) camToggle.onclick = ()=>{
    if(qrScanner){ stopScanner(); camToggle.textContent='Start camera'; }
    else { startScanner(); camToggle.textContent='Stop camera'; }
  };
  const manualGo = document.getElementById('btn-manual-go');
  if(manualGo) manualGo.onclick = ()=>{
    const v = document.getElementById('f-manual-asset').value.trim();
    if(!v){ toast('Enter an Asset No.'); return; }
    loadAssetIntoWizard(v);
  };
  const backJob = document.getElementById('btn-back-job');
  if(backJob) backJob.onclick = ()=>{ wizardStep='job'; renderAll(); };

  const readingsBack = document.getElementById('btn-readings-back');
  if(readingsBack) readingsBack.onclick = ()=>{ wizardStep='scan'; renderAll(); };
  const classSelect = document.getElementById('f-class');
  if(classSelect) classSelect.onchange = ()=>{
    const earthInput = document.getElementById('f-earth');
    if(!earthInput) return;
    if(classSelect.value==='II'){
      earthInput.disabled = true;
      earthInput.value = '';
      earthInput.placeholder = 'N/A — Class II has no earth';
    }else{
      earthInput.disabled = false;
      earthInput.placeholder = '';
    }
  };
  const readingsNext = document.getElementById('btn-readings-next');
  if(readingsNext) readingsNext.onclick = ()=>{
    currentAsset.description = document.getElementById('f-desc').value.trim();
    currentAsset.location = document.getElementById('f-loc').value.trim();
    currentAsset.class = document.getElementById('f-class').value;
    currentAsset.applianceType = document.getElementById('f-appliance-type').value;
    currentReadings = {
      visual: document.getElementById('f-visual').value,
      polarity: document.getElementById('f-polarity').value,
      earthBond: document.getElementById('f-earth').value,
      insulation: document.getElementById('f-insul').value,
      load: document.getElementById('f-load').value,
      leakage: document.getElementById('f-leak').value,
      microwaveLeakage: currentAsset.applianceType==='Microwave' ? (document.getElementById('f-mwleak')?.value ?? '') : '',
      notes: document.getElementById('f-notes').value.trim(),
    };
    wizardStep = 'check';
    renderAll();
  };

  const checkBack = document.getElementById('btn-check-back');
  if(checkBack) checkBack.onclick = ()=>{ wizardStep='readings'; renderAll(); };
  const checkNext = document.getElementById('btn-check-next');
  if(checkNext) checkNext.onclick = ()=>{
    currentResult = calculateResult();
    wizardStep = 'result';
    renderAll();
  };

  const saveResult = document.getElementById('btn-save-result');
  if(saveResult) saveResult.onclick = async ()=>{
    await commitResult();
    toast('Test saved');
    currentAsset = null; currentReadings = null; currentResult = null;
    wizardStep = 'scan';
    renderAll();
  };
  const discardResult = document.getElementById('btn-discard-result');
  if(discardResult) discardResult.onclick = ()=>{
    currentAsset=null; currentReadings=null; currentResult=null;
    wizardStep='scan'; renderAll();
  };

  // -- People --
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ peopleTab=b.dataset.p; renderAll(); });
  const saveEquip = document.getElementById('btn-save-equip');
  if(saveEquip) saveEquip.onclick = async ()=>{
    const id = document.getElementById('eq-id').value.trim();
    if(!id){ toast('Enter an Equipment ID'); return; }
    const rec = { id, makeModel: document.getElementById('eq-model').value.trim(), serial: document.getElementById('eq-serial').value.trim(),
      calDate: document.getElementById('eq-cal').value, active: document.getElementById('eq-active').value, notes: document.getElementById('eq-notes').value.trim() };
    const idx = DB.testEquipment.findIndex(e=>e.id===id);
    if(idx>-1) DB.testEquipment[idx]=rec; else DB.testEquipment.push(rec);
    await save('testEquipment'); toast('Instrument saved'); renderAll();
  };
  const saveEng = document.getElementById('btn-save-eng');
  if(saveEng) saveEng.onclick = async ()=>{
    const id = document.getElementById('en-id').value.trim();
    if(!id){ toast('Enter an Engineer ID'); return; }
    const rec = { id, name: document.getElementById('en-name').value.trim(), active: document.getElementById('en-active').value, notes: document.getElementById('en-notes').value.trim() };
    const idx = DB.engineers.findIndex(e=>e.id===id);
    if(idx>-1) DB.engineers[idx]=rec; else DB.engineers.push(rec);
    await save('engineers'); toast('Engineer saved'); renderAll();
  };

  // -- Register --
  const regSearch = document.getElementById('reg-search');
  if(regSearch) regSearch.oninput = (e)=>{ registerFilter = e.target.value; renderAll(); setTimeout(()=>{ const el=document.getElementById('reg-search'); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} },0); };
  document.querySelectorAll('tr[data-asset]').forEach(tr=>tr.onclick=()=>{
    const an = tr.dataset.asset;
    expandedAsset = expandedAsset===an? null : an;
    renderAll();
  });

  // -- History --
  const histSearch = document.getElementById('hist-search');
  if(histSearch) histSearch.oninput = (e)=>{ historyFilter = e.target.value; renderAll(); setTimeout(()=>{ const el=document.getElementById('hist-search'); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} },0); };

  // -- IO --
  const btnExport = document.getElementById('btn-export');
  if(btnExport) btnExport.onclick = exportWorkbook;
  const btnMerge = document.getElementById('btn-import-merge');
  if(btnMerge) btnMerge.onclick = ()=>importFile('merge');
  const btnReplace = document.getElementById('btn-import-replace');
  if(btnReplace) btnReplace.onclick = ()=>{ if(confirm('This replaces ALL current data with the file contents. Continue?')) importFile('replace'); };

  // -- Settings --
  const saveSettings = document.getElementById('btn-save-settings');
  if(saveSettings) saveSettings.onclick = async ()=>{
    DB.settings.earthBondMax = parseFloat(document.getElementById('s-earth').value)||0.1;
    DB.settings.insulationMin = parseFloat(document.getElementById('s-insul').value)||1;
    DB.settings.leakageMaxClassI = parseFloat(document.getElementById('s-leak1').value)||3.5;
    DB.settings.leakageMaxClassII = parseFloat(document.getElementById('s-leak2').value)||0.5;
    DB.settings.microwaveLeakageMax = parseFloat(document.getElementById('s-mwleak').value)||5;
    DB.settings.retestMonths = parseInt(document.getElementById('s-retest').value)||12;
    await save('settings'); toast('Thresholds saved');
  };
  const clearAll = document.getElementById('btn-clear-all');
  if(clearAll) clearAll.onclick = async ()=>{
    if(!confirm('This permanently deletes every record on every device. Type OK to confirm.')) return;
    if(!confirm('Really sure? This cannot be undone.')) return;
    DB = { assetRegister:[], testEquipment:[], engineers:[], testHistory:[], jobLog:[],
      settings:{ earthBondMax:0.1, insulationMin:1, leakageMaxClassI:3.5, leakageMaxClassII:0.5, microwaveLeakageMax:5, retestMonths:12, nextTestSeq:1 } };
    await saveMany(TABLES);
    currentJob=null; wizardStep='job'; activeTab='newtest';
    toast('All data cleared');
    renderAll();
  };
}

async function commitResult(){
  const testId = genId('T');
  const eq = DB.testEquipment.find(e=>e.id===currentJob.equipmentId);
  const retestDate = addMonths(todayISO(), DB.settings.retestMonths);
  const record = {
    testId, assetNo: currentAsset.assetNo, description: currentAsset.description, location: currentAsset.location, site: currentJob.site,
    testDate: todayISO(), retestDate, visual: currentReadings.visual, earthBond: currentReadings.earthBond, insulation: currentReadings.insulation,
    load: currentReadings.load, leakage: currentReadings.leakage, polarity: currentReadings.polarity, passFail: currentResult.pass?'Pass':'Fail',
    tester: currentJob.equipmentLabel, testerSerial: currentJob.serial, calDate: currentJob.calDate, engineer: currentJob.engineerName, notes: currentReadings.notes,
    applianceType: currentAsset.applianceType, microwaveLeakage: currentReadings.microwaveLeakage
  };
  DB.testHistory.push(record);

  const idx = DB.assetRegister.findIndex(a=>String(a.assetNo)===String(currentAsset.assetNo));
  const assetRow = Object.assign({}, record, { class: currentAsset.class, status: 'Active' });
  delete assetRow.testId;
  if(idx>-1) DB.assetRegister[idx] = Object.assign({}, DB.assetRegister[idx], assetRow);
  else DB.assetRegister.push(assetRow);

  await saveMany(['testHistory','assetRegister','settings']);
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  document.getElementById('view').innerHTML = `<div class="empty-state"><div class="big-emoji">⏳</div>Loading register…</div>`;
  await loadAll();
  renderAll();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Service worker registration failed', e));
  }
})();
</script>
